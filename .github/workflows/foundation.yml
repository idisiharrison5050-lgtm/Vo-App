name: Build Vo-App foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foundation.yml'
      - 'docs/IMPLEMENTATION_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql, pdo_sqlite, sqlite3, redis
          tools: composer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install backend platform packages
        working-directory: backend
        run: |
          composer require laravel/sanctum laravel/reverb laravel/horizon --no-interaction --no-progress
          php artisan install:api --no-interaction
          php artisan horizon:install --no-interaction
          php artisan install:broadcasting --reverb --no-interaction

      - name: Create backend domain structure
        working-directory: backend
        run: |
          mkdir -p app/Domain/{Numbers,Sms,Wallet,Orders,Providers,Users}
          mkdir -p app/Http/Controllers/Api/V1
          mkdir -p app/Support
          mkdir -p database/seeders

          cat > app/Support/ApiResponse.php <<'PHP'
          <?php

          namespace App\Support;

          class ApiResponse
          {
              public static function success(mixed $data = null, string $message = 'OK', int $status = 200): \Illuminate\Http\JsonResponse
              {
                  return response()->json([
                      'success' => true,
                      'message' => $message,
                      'data' => $data,
                  ], $status);
              }
          }
          PHP

          cat > app/Http/Controllers/Api/V1/HealthController.php <<'PHP'
          <?php

          namespace App\Http\Controllers\Api\V1;

          use App\Http\Controllers\Controller;
          use App\Support\ApiResponse;

          class HealthController extends Controller
          {
              public function __invoke()
              {
                  return ApiResponse::success([
                      'service' => 'vo-app-api',
                      'status' => 'operational',
                      'version' => 'v1',
                  ]);
              }
          }
          PHP

          cat > app/Http/Controllers/Api/V1/MeController.php <<'PHP'
          <?php

          namespace App\Http\Controllers\Api\V1;

          use App\Http\Controllers\Controller;
          use App\Support\ApiResponse;

          class MeController extends Controller
          {
              public function __invoke(\Illuminate\Http\Request $request)
              {
                  return ApiResponse::success($request->user());
              }
          }
          PHP

          cat > routes/api.php <<'PHP'
          <?php

          use App\Http\Controllers\Api\V1\HealthController;
          use App\Http\Controllers\Api\V1\MeController;
          use Illuminate\Support\Facades\Route;

          Route::prefix('v1')->group(function () {
              Route::get('/health', HealthController::class);

              Route::middleware('auth:sanctum')->group(function () {
                  Route::get('/me', MeController::class);
              });
          });
          PHP

          cat > app/Models/Country.php <<'PHP'
          <?php

          namespace App\Models;

          use Illuminate\Database\Eloquent\Factories\HasFactory;
          use Illuminate\Database\Eloquent\Model;
          use Illuminate\Database\Eloquent\Relations\HasMany;

          class Country extends Model
          {
              use HasFactory;

              protected $fillable = ['iso2', 'iso3', 'name', 'dial_code', 'is_active'];

              protected function casts(): array
              {
                  return ['is_active' => 'boolean'];
              }

              public function phoneNumbers(): HasMany
              {
                  return $this->hasMany(PhoneNumber::class);
              }
          }
          PHP

          cat > app/Models/Service.php <<'PHP'
