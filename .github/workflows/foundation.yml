      - name: Add project documentation
        run: |
          mkdir -p docs
          cat > docs/ARCHITECTURE.md <<'MD'
          # Vo-App Architecture

          Vo-App is a production virtual-number platform, not a disposable-number demo.

          ## Core
          - Flutter mobile client for Android and iOS.
          - Laravel 13 API and domain services.
          - PostgreSQL for production persistence.
          - Redis for cache, queues and realtime infrastructure.
          - Sanctum for mobile API authentication.
          - Reverb for realtime events.
          - Horizon for queue operations.

          ## Domain boundaries
          Numbers, assignments, orders, wallet ledger, SMS, providers and users are separate domain concerns. External provider behavior is hidden behind provider contracts so the platform can support multiple suppliers and routing/failover later.

          ## Money
          Monetary values are stored as integer minor units. Wallet history is append-only and idempotent. A mutable balance is never the source of truth.

          ## Long-term numbers
          A phone number is inventory. A `number_assignment` is the customer's durable relationship with that number. Annual and other long-term plans therefore survive independently of inventory records and can be renewed.

          ## Event flow
          Provider webhook -> validated webhook event -> domain service -> database -> broadcast event -> Flutter realtime listener. Polling is the fallback when realtime transport is unavailable.
          MD

          cat > docs/DATABASE.md <<'MD'
          # Vo-App Database Model

          Initial production model:
          - users
          - countries
          - services
          - providers
          - phone_numbers
          - number_assignments
          - orders
          - wallet_ledger_entries
          - sms_messages
          - provider_webhook_events

          Design rules:
          1. Use foreign keys and explicit lifecycle statuses.
          2. Use UUID/reference identifiers for customer-visible transaction references.
          3. Store money in minor units.
          4. Make money-moving operations idempotent.
          5. Preserve webhook payloads for reconciliation and audit.
          6. Never expose provider credentials to Flutter.
          MD

          cat > docs/SECURITY.md <<'MD'
          # Vo-App Security Baseline

          - Sanctum tokens are server-issued and revocable.
          - Provider secrets remain server-side.
          - Rate limits and abuse controls are mandatory on authentication, purchasing, SMS and webhook surfaces.
          - Webhooks must be authenticated, deduplicated and recorded before processing.
          - Wallet mutations require idempotency keys and database transactions.
          - Audit trails will be added to administrative and financial operations.
          - The platform is intended for legitimate communications and verification workflows; features designed to bypass provider anti-abuse systems or mass-create accounts are out of scope.
          MD

      - name: Validate generated foundation
        working-directory: backend
        run: |
          composer validate --no-check-publish
          php artisan about --only=environment,cache,database
          php artisan route:list --path=api

      - name: Validate Flutter foundation
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Commit foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend mobile docs
          if git diff --cached --quiet; then
            echo 'Foundation already current.'
            exit 0
          fi
          git commit -m 'feat: establish Vo-App production foundation'
          git push
