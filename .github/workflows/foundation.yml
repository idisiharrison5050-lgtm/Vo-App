          cat > app/Domain/Wallet/WalletLedger.php <<'PHP'
          <?php

          namespace App\Domain\Wallet;

          use App\Models\WalletLedgerEntry;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Str;

          class WalletLedger
          {
              public function credit(int $userId, int $amountMinor, string $currency, string $idempotencyKey, string $type, array $metadata = []): WalletLedgerEntry
              {
                  return DB::transaction(function () use ($userId, $amountMinor, $currency, $idempotencyKey, $type, $metadata) {
                      $existing = WalletLedgerEntry::where('idempotency_key', $idempotencyKey)->first();
                      if ($existing) return $existing;

                      $balance = (int) WalletLedgerEntry::where('user_id', $userId)
                          ->where('currency', $currency)->lockForUpdate()->sum(DB::raw("CASE WHEN direction = 'credit' THEN amount_minor ELSE -amount_minor END"));

                      return WalletLedgerEntry::create([
                          'user_id' => $userId,
                          'reference' => 'WAL-' . Str::upper(Str::random(20)),
                          'idempotency_key' => $idempotencyKey,
                          'type' => $type,
                          'direction' => 'credit',
                          'amount_minor' => $amountMinor,
                          'currency' => $currency,
                          'balance_after_minor' => $balance + $amountMinor,
                          'status' => 'posted',
                          'metadata' => $metadata,
                      ]);
                  });
              }
          }
          PHP

