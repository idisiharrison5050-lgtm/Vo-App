          from pathlib import Path
          p = Path('bootstrap/app.php')
          s = p.read_text()
          s = s.replace("web: __DIR__.'/../routes/web.php',\n        commands:", "web: __DIR__.'/../routes/web.php',\n        api: __DIR__.'/../routes/api.php',\n        commands:")
