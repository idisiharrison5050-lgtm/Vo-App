name: Retry Vo-App foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foundation-retry.yml'

permissions:
  contents: write

jobs:
  foundation-retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql, pdo_sqlite, sqlite3, redis
          tools: composer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Laravel platform packages
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          composer require laravel/sanctum laravel/reverb laravel/horizon --with-all-dependencies --no-interaction --no-progress
          php artisan install:api --no-interaction
          php artisan horizon:install --no-interaction
          php artisan install:broadcasting --reverb --no-interaction

      - name: Commit installed platform foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git diff --cached --quiet && echo 'No foundation package changes required.' && exit 0
          git commit -m 'feat: install Laravel platform foundation'
          git push
