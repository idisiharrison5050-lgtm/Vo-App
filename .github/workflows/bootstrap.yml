name: Bootstrap Vo-App applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql, pdo_sqlite, sqlite3
          tools: composer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Laravel backend when missing
        run: |
          if [ ! -f backend/artisan ]; then
            mkdir -p backend
            composer create-project laravel/laravel /tmp/voapp-backend --no-interaction --prefer-dist
            cp -a /tmp/voapp-backend/. backend/
          else
            echo 'Laravel backend already exists; leaving it untouched.'
          fi

      - name: Create Flutter application when missing
        run: |
          if [ ! -f mobile/pubspec.yaml ]; then
            mkdir -p mobile
            flutter create mobile --platforms=android,ios --org com.voapp --project-name vo_app
          else
            echo 'Flutter application already exists; leaving it untouched.'
          fi

      - name: Remove bootstrap placeholders
        run: |
          rm -f backend/.gitkeep mobile/.gitkeep

      - name: Commit generated applications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend mobile
          if git diff --cached --quiet; then
            echo 'No bootstrap changes required.'
            exit 0
          fi
          git commit -m 'chore: bootstrap Laravel and Flutter applications'
          git push
