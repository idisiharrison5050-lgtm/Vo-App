name: Bootstrap Laravel MVP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !hashFiles('artisan') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3
      - name: Install Laravel skeleton
        run: |
          composer create-project laravel/laravel /tmp/laravel --no-interaction --prefer-dist
          cp -a /tmp/laravel/. .
      - name: Write project README
        run: |
          cat > README.md <<'EOF'
# Vo-App

A premium real-time VoIP MVP built with Laravel.

## MVP
- Secure authentication
- Contacts and favorites
- Recent calls and call records
- Browser WebRTC call screen
- Laravel API foundation for signaling
- Premium responsive UI
- SQLite for zero-friction local development; PostgreSQL-ready

## Local setup
```bash
composer install
cp .env.example .env
php artisan key:generate
php artisan migrate
php artisan serve
```

Open `http://127.0.0.1:8000`.
EOF
      - name: Commit generated application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: bootstrap Laravel application' || exit 0
          git push
